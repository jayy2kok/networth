limit_req_zone $binary_remote_addr zone=mcp:10m rate=30r/m;

server {
    listen 80;
    server_name ${MCP_HOSTNAME};
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name ${MCP_HOSTNAME};

    ssl_certificate /etc/letsencrypt/live/${MCP_HOSTNAME}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${MCP_HOSTNAME}/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location /mcp {
        limit_req zone=mcp burst=10 nodelay;
        client_max_body_size 64k;
        proxy_pass http://mcp-server:8080;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 65s;
        proxy_send_timeout 65s;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / { return 404; }
}